<div class="parametro-senha">
  <h4 class="parametro-senha_titulo">numero de caracteres</h4>
    <div class="parametro-senha-botoes">
      <button class="parametro-senha_botao">-</button>
        <p class="parametro-senha_texto">12</p>
        <button class="parametro-senha_botao">+</button> 
<!DOCTYPE html>
      <html lang="pt-BR">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>gerador de senhas</title>
          <link rel="stylesheet" href="style.css">

        </head>
        <body>

          <div class="container">
            <h1>gerador de senhas</h1>

            <div class="senha-box">
              <input type="text" id="senha" readonly placeholder="sua senha aqui"
                <button id="copiar">copiar</button>
              </div>

            <div class="opcao">
              <label>tamanho:<input type+"nunmber" id="tamanho" value="12" min="4" max="32"></label>
            </div>

            <div class="opcao">
              <label>letras maiusculas <input type="checkbox" id="maiusculas" checked></label>
            </div>

             <div class="opcao">
              <label>letras minusculas <input type="checkbox" id="minusculas" checked></label>
            </div>

            <div class="opcao">
              <label>numeros <input type="checkbox" id="numeros" checked></label>
            </div>

            <div class="opcao">
              <label>simbolos !@#$ <input type="checkbox" id="simbolos" checked></label>
            </div

              <button id="gerar">gerar senha</button>
            <p class="forca" id="forca"></p>
          </div>

          <script src="script.js"></script>
        </body>
      </html>

          </div>
